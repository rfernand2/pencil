<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steampunk Ace of Diamonds Transformation (Treated as Clubs)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            overflow: hidden; /* Prevent scrollbars */
        }

        #container {
            position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            border-radius: 10px; /* Optional, for cleaner edges */
            overflow: hidden; /* Crucial for the background image */
        }

        #backgroundImage {
            width: auto;
            height: 90vh; /* Scaled for standard screens, keep aspect ratio */
            display: block;
            border-radius: 10px;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: crosshair; /* Visible drawing cursor */
        }
    </style>
</head>
<body>

    <div id="container">
        <!-- Baseline Image from input -->
        <img id="backgroundImage" src="https://www.bubbbly.com/assets/ace-of-clubs.webp" alt="Ace of Diamonds (User-treated as Clubs)">
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const img = document.getElementById('backgroundImage');

        // Configuration for the hand-drawn style
        const sketchColor = '#333'; // Slightly warmer black/dark gray
        const sketchWidth = 3;
        const colorWash = 'rgba(218, 165, 32, 0.5)'; // Translucent brass-like patina
        const sketchSpeed = 25; // Milliseconds between steps (lower is faster)
        const lineWobble = 2.5; // Maximum pixel variation for hand-drawn effect

        let drawingPaths = [];
        let isDrawing = false;
        let animationFrame;

        // Initialize canvas once image is loaded to set correct dimensions
        img.onload = function() {
            canvas.width = img.clientWidth;
            canvas.height = img.clientHeight;
            // Define the steampunk artwork steps, transforming the central and corner diamond shapes.
            defineArtwork();
            animateDrawing();
        };

        // If the image is already cached, trigger the load event manually
        if (img.complete) {
            img.onload();
        }

        // --- Define the Artwork Points ---
        // Coordinates will be relative to canvas size (0 to canvas.width/height)
        function defineArtwork() {
            const w = canvas.width;
            const h = canvas.height;
            const centerX = w / 2;
            const centerY = h / 2;

            // Artwork concept: A detailed Steampunk clockwork mechanism is drawn inside the card, 
            // transforming the central diamond shape into the core gear and clock face,
            // and the smaller diamonds in the corners into interlocking cogs and gauges.

            // 1. Outline the main central gear (the large central shape, based on the diamond)
            const mainGearOutline = createGear(centerX, centerY, 80, 20); // Center, radius, number of teeth

            // 2. Smaller, interlocking side gears
            const sideGear1 = createGear(centerX - 120, centerY - 80, 40, 10);
            const sideGear2 = createGear(centerX + 120, centerY + 80, 40, 10);
            
            // 3. Very small cogs for the corners (near the 'A's, where the small diamonds are)
            const smallCogTopLeft = createGear(centerX - 180, centerY - 250, 20, 8);
            const smallCogBottomRight = createGear(centerX + 180, centerY + 250, 20, 8);

            // 4. Details for the central gear: a clock face and hands
            const clockFace = createCirclePath(centerX, centerY, 60);
            const handHour = {points: [{x: centerX, y: centerY}, {x: centerX - 30, y: centerY + 10}]};
            const handMinute = {points: [{x: centerX, y: centerY}, {x: centerX + 50, y: centerY - 20}]};
            
            // Simplified, drawn Roman numerals
            const numerals = [
                {points: [{x: centerX + 50, y: centerY + 10}, {x: centerX + 55, y: centerY + 15}]}, // I
                {points: [{x: centerX - 5, y: centerY + 50}, {x: centerX - 10, y: centerY + 55}]}, // VI
                {points: [{x: centerX - 50, y: centerY - 5}, {x: centerX - 55, y: centerY - 10}]}, // IX
                {points: [{x: centerX + 10, y: centerY - 50}, {x: centerX + 15, y: centerY - 55}]}, // XII
                // Add more lines to form other numbers if needed, but keeping it simple for the drawing process.
                {points: [{x: centerX + 40, y: centerY + 40}, {x: centerX + 45, y: centerY + 45}, {x: centerX + 40, y: centerY + 40}, {x: centerX + 45, y: centerY + 45}]}, // II
                {points: [{x: centerX - 40, y: centerY - 40}, {x: centerX - 45, y: centerY - 45}, {x: centerX - 40, y: centerY - 40}, {x: centerX - 45, y: centerY - 45}]}, // VIII
            ];

            // 5. Connective elements, bolts, and small details
            const connectors = [
                {points: [{x: centerX - 100, y: centerY - 60}, {x: centerX - 80, y: centerY - 40}]},
                {points: [{x: centerX + 100, y: centerY + 60}, {x: centerX + 80, y: centerY + 40}]},
                {points: createCirclePath(centerX - 110, centerY - 70, 5)}, // Bolt
                {points: createCirclePath(centerX + 110, centerY + 70, 5)}, // Bolt
                {points: createCirclePath(centerX - 170, centerY - 240, 5)}, // Bolt
                {points: createCirclePath(centerX + 170, centerY + 240, 5)}, // Bolt
            ];

            // 6. Add fill color step for a patina wash
            // A wash over the central complex to simulate a brass/copper patina
            const washMain = {type: 'fill', color: colorWash, points: [
                ...mainGearOutline, ...sideGear1, ...sideGear2, ...clockFace
            ]};

            // Store paths with additional info (close path, type)
            drawingPaths = [
                {points: mainGearOutline, close: true, delay: 400},
                {points: sideGear1, close: true},
                {points: sideGear2, close: true},
                {points: clockFace, close: true},
                handHour,
                handMinute,
                ...numerals, // Simplified drawn numbers
                {points: smallCogTopLeft, close: true},
                {points: smallCogBottomRight, close: true},
                ...connectors, // Bolts and connectors
                washMain // A patina color wash
            ];
        }

        // --- Helper functions for geometric shapes ---

        function createGear(x, y, radius, numTeeth) {
            const points = [];
            const angleStep = (Math.PI * 2) / numTeeth;
            const toothHeight = radius * 0.2;
            const toothWidthAngle = angleStep * 0.4; // width at tip

            for (let i = 0; i < numTeeth; i++) {
                const angle = i * angleStep;
                const innerR = radius;
                const outerR = radius + toothHeight;

                // Tooth base
                points.push({x: x + Math.cos(angle - toothWidthAngle) * innerR, y: y + Math.sin(angle - toothWidthAngle) * innerR});
                // Tooth tip 1
                points.push({x: x + Math.cos(angle - toothWidthAngle) * outerR, y: y + Math.sin(angle - toothWidthAngle) * outerR});
                // Tooth tip 2
                points.push({x: x + Math.cos(angle + toothWidthAngle) * outerR, y: y + Math.sin(angle + toothWidthAngle) * outerR});
                // Tooth base 2
                points.push({x: x + Math.cos(angle + toothWidthAngle) * innerR, y: y + Math.sin(angle + toothWidthAngle) * innerR});
                // Inner curve segment to the next tooth base
                const nextAngle = (i + 1) * angleStep;
                points.push({x: x + Math.cos(nextAngle - toothWidthAngle) * innerR, y: y + Math.sin(nextAngle - toothWidthAngle) * innerR});
            }
            return points;
        }

        function createCirclePath(x, y, radius) {
            const points = [];
            const numSegments = 30; // for a hand-drawn look, more segments make it smoother, less makes it wobbly
            for (let i = 0; i < numSegments; i++) {
                const angle = (Math.PI * 2) * (i / numSegments);
                points.push({x: x + Math.cos(angle) * radius, y: y + Math.sin(angle) * radius});
            }
            return points;
        }

        // --- Drawing and Animation Logic ---

        function drawStroke(p1, p2, color, width) {
            // Apply a slight random wobble to simulate hand-drawn inaccuracy
            const wobbleX1 = (Math.random() - 0.5) * lineWobble;
            const wobbleY1 = (Math.random() - 0.5) * lineWobble;
            const wobbleX2 = (Math.random() - 0.5) * lineWobble;
            const wobbleY2 = (Math.random() - 0.5) * lineWobble;

            ctx.beginPath();
            ctx.moveTo(p1.x + wobbleX1, p1.y + wobbleY1);
            ctx.lineTo(p2.x + wobbleX2, p2.y + wobbleY2);
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.lineCap = 'round'; // Softer look
            ctx.lineJoin = 'round';
            ctx.stroke();
        }

        function fillComplexShape(points, color) {
            // This is complex and might fill the 'inside' of multiple shapes,
            // giving a wash over everything.
            ctx.beginPath();
            if (points.length > 0) {
                ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i].x, points[i].y);
                }
                ctx.fillStyle = color;
                ctx.fill();
            }
        }

        let currentPathIndex = 0;
        let currentPointIndex = 0;

        function animateDrawing() {
            if (currentPathIndex >= drawingPaths.length) {
                isDrawing = false;
                cancelAnimationFrame(animationFrame);
                return; // Reached the end
            }

            isDrawing = true;
            const currentPath = drawingPaths[currentPathIndex];
            const points = currentPath.points;

            // Check if it's a fill step or a normal stroke step
            if (currentPath.type === 'fill') {
                fillComplexShape(currentPath.points, currentPath.color);
                currentPathIndex++;
                currentPointIndex = 0;
                requestAnimationFrame(animateDrawing);
                return;
            }

            // Draw line segment
            if (currentPointIndex < points.length - 1) {
                drawStroke(points[currentPointIndex], points[currentPointIndex + 1], sketchColor, sketchWidth);
                currentPointIndex++;
            } else if (currentPath.close && currentPointIndex === points.length - 1) {
                // Close the path if specified (for gears and circles)
                drawStroke(points[currentPointIndex], points[0], sketchColor, sketchWidth);
                currentPointIndex++;
            } else {
                // Move to the next path
                currentPathIndex++;
                currentPointIndex = 0;
                // Add a small delay between major objects if specified
                if (currentPath.delay) {
                    isDrawing = false;
                    setTimeout(() => {
                        requestAnimationFrame(animateDrawing);
                    }, currentPath.delay);
                    return;
                }
            }

            // Schedule the next segment drawing
            setTimeout(() => {
                requestAnimationFrame(animateDrawing);
            }, sketchSpeed);
        }

    </script>
</body>
</html>
