<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ace of Clubs</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  #stage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #frame {
    position: relative;
    display: block;
    line-height: 0;
  }
  #card {
    display: block;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  #ink, #cur {
    position: absolute;
    left: 0;
    top: 0;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <img id="card" alt="" src="ace.jpg" />
    <canvas id="ink"></canvas>
    <canvas id="cur"></canvas>
  </div>
</div>
<script>
(function () {
  const img = document.getElementById("card");
  const frame = document.getElementById("frame");
  const ink = document.getElementById("ink");
  const cur = document.getElementById("cur");
  let inkCtx, curCtx;
  let W = 300, H = 420;
  let actions = [];
  let actI = 0;
  let phase = 0;
  let lastT = 0;
  let pencil = { x: 20, y: 12, angle: 0.6 };
  let showPencil = false;
  let finished = false;
  let finishAt = 0;
  let fading = false;
  let fade = 1;
  let started = false;
  let lastNow = 0;

  function makeRand(seed) {
    let s = seed >>> 0;
    return function () {
      s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  function qbez(x0, y0, x1, y1, x2, y2, n, wob, rnd) {
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n, u = 1 - t;
      let x = u * u * x0 + 2 * u * t * x1 + t * t * x2;
      let y = u * u * y0 + 2 * u * t * y1 + t * t * y2;
      if (wob && i > 0 && i < n) {
        x += (rnd() - 0.5) * wob;
        y += (rnd() - 0.5) * wob;
      }
      pts.push({ x, y });
    }
    return pts;
  }

  function cbez(x0, y0, x1, y1, x2, y2, x3, y3, n, wob, rnd) {
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n, u = 1 - t;
      let x = u * u * u * x0 + 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t * x3;
      let y = u * u * u * y0 + 3 * u * u * t * y1 + 3 * u * t * t * y2 + t * t * t * y3;
      if (wob && i > 0 && i < n) {
        x += (rnd() - 0.5) * wob;
        y += (rnd() - 0.5) * wob;
      }
      pts.push({ x, y });
    }
    return pts;
  }

  function hline(x0, y0, x1, y1, n, wob, rnd) {
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const j = i > 0 && i < n;
      pts.push({
        x: x0 + (x1 - x0) * t + (j ? (rnd() - 0.5) * wob : 0),
        y: y0 + (y1 - y0) * t + (j ? (rnd() - 0.5) * wob : 0)
      });
    }
    return pts;
  }

  function measure(pts) {
    const cum = [0];
    let L = 0;
    for (let i = 1; i < pts.length; i++) {
      L += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
      cum.push(L);
    }
    return { L: L || 0.001, cum };
  }

  function atLen(pts, cum, dist) {
    const total = cum[cum.length - 1];
    if (dist <= 0) {
      const a = Math.atan2(pts[1].y - pts[0].y, pts[1].x - pts[0].x);
      return { x: pts[0].x, y: pts[0].y, angle: a };
    }
    if (dist >= total) {
      const n = pts.length;
      const a = Math.atan2(pts[n - 1].y - pts[n - 2].y, pts[n - 1].x - pts[n - 2].x);
      return { x: pts[n - 1].x, y: pts[n - 1].y, angle: a };
    }
    let i = 1;
    while (i < cum.length && cum[i] < dist) i++;
    const seg = cum[i] - cum[i - 1];
    const u = seg > 0 ? (dist - cum[i - 1]) / seg : 0;
    const x = pts[i - 1].x + (pts[i].x - pts[i - 1].x) * u;
    const y = pts[i - 1].y + (pts[i].y - pts[i - 1].y) * u;
    const angle = Math.atan2(pts[i].y - pts[i - 1].y, pts[i].x - pts[i - 1].x);
    return { x, y, angle };
  }

  function X(x) { return (x / 100) * W; }
  function Y(y) { return (y / 100) * H; }
  function SW(u) { return (u / 100) * W; }

  function drawClubSymbol(g, cx, cy, size) {
    const r = size * 0.27;
    g.fillStyle = "#111";
    g.beginPath();
    g.arc(cx, cy - r * 0.98, r, 0, Math.PI * 2);
    g.arc(cx - r * 0.94, cy + r * 0.38, r, 0, Math.PI * 2);
    g.arc(cx + r * 0.94, cy + r * 0.38, r, 0, Math.PI * 2);
    g.fill();
    g.beginPath();
    g.arc(cx, cy + r * 0.12, r * 0.62, 0, Math.PI * 2);
    g.fill();
    g.beginPath();
    g.moveTo(cx - r * 0.18, cy + r * 0.45);
    g.quadraticCurveTo(cx - r * 0.18, cy + r * 1.15, cx - r * 0.62, cy + r * 2.02);
    g.lineTo(cx + r * 0.62, cy + r * 2.02);
    g.quadraticCurveTo(cx + r * 0.18, cy + r * 1.15, cx + r * 0.18, cy + r * 0.45);
    g.closePath();
    g.fill();
  }

  function makeFallback() {
    const w = 700, h = 980;
    const c = document.createElement("canvas");
    c.width = w;
    c.height = h;
    const g = c.getContext("2d");
    g.fillStyle = "#000";
    g.fillRect(0, 0, w, h);
    const m = 10;
    const rw = w - m * 2, rh = h - m * 2;
    const rad = 28;
    g.fillStyle = "#fbfbfb";
    g.beginPath();
    g.moveTo(m + rad, m);
    g.arcTo(m + rw, m, m + rw, m + rh, rad);
    g.arcTo(m + rw, m + rh, m, m + rh, rad);
    g.arcTo(m, m + rh, m, m, rad);
    g.arcTo(m, m, m + rw, m, rad);
    g.closePath();
    g.fill();
    g.strokeStyle = "rgba(0,0,0,0.08)";
    g.lineWidth = 2;
    g.stroke();

    g.fillStyle = "#111";
    g.font = "bold 92px Georgia, 'Times New Roman', serif";
    g.textAlign = "center";
    g.textBaseline = "top";
    g.fillText("A", m + 62, m + 28);
    drawClubSymbol(g, m + 62, m + 168, 52);

    drawClubSymbol(g, w / 2, h * 0.455, 210);

    g.save();
    g.translate(w - m - 62, h - m - 28);
    g.rotate(Math.PI);
    g.font = "bold 92px Georgia, 'Times New Roman', serif";
    g.textAlign = "center";
    g.textBaseline = "top";
    g.fillStyle = "#111";
    g.fillText("A", 0, 0);
    drawClubSymbol(g, 0, 140, 52);
    g.restore();

    return c.toDataURL("image/png");
  }

  function simpleLeaf(cx, cy, angDeg, len, wid, rnd) {
    const ang = (angDeg * Math.PI) / 180;
    const dx = Math.cos(ang), dy = Math.sin(ang);
    const px = -dy, py = dx;
    const n = 14;
    const outline = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const w = Math.sin(t * Math.PI) * wid * (0.85 + rnd() * 0.25);
      outline.push({
        x: cx + dx * len * t + px * w + (rnd() - 0.5) * 0.12,
        y: cy + dy * len * t + py * w + (rnd() - 0.5) * 0.12
      });
    }
    for (let i = n; i >= 0; i--) {
      const t = i / n;
      const w = Math.sin(t * Math.PI) * wid * (0.85 + rnd() * 0.25);
      outline.push({
        x: cx + dx * len * t - px * w + (rnd() - 0.5) * 0.12,
        y: cy + dy * len * t - py * w + (rnd() - 0.5) * 0.12
      });
    }
    const vein = hline(cx, cy, cx + dx * len * 0.9, cy + dy * len * 0.9, 8, 0.1, rnd);
    return { outline, vein };
  }

  function oakLeaf(cx, cy, angDeg, len, rnd) {
    const ang = (angDeg * Math.PI) / 180;
    const dx = Math.cos(ang), dy = Math.sin(ang);
    const px = -dy, py = dx;
    const lobes = [
      { t: 0.08, w: 0.12 },
      { t: 0.22, w: 0.28 },
      { t: 0.28, w: 0.16 },
      { t: 0.42, w: 0.34 },
      { t: 0.50, w: 0.18 },
      { t: 0.64, w: 0.28 },
      { t: 0.72, w: 0.14 },
      { t: 0.86, w: 0.16 },
      { t: 1.00, w: 0.0 }
    ];
    const outline = [{ x: cx, y: cy }];
    for (const lobe of lobes) {
      const bx = cx + dx * len * lobe.t;
      const by = cy + dy * len * lobe.t;
      const ww = lobe.w * len;
      outline.push({
        x: bx + px * ww + (rnd() - 0.5) * 0.18,
        y: by + py * ww + (rnd() - 0.5) * 0.18
      });
    }
    for (let i = lobes.length - 2; i >= 0; i--) {
      const lobe = lobes[i];
      const bx = cx + dx * len * lobe.t;
      const by = cy + dy * len * lobe.t;
      const ww = lobe.w * len;
      outline.push({
        x: bx - px * ww + (rnd() - 0.5) * 0.18,
        y: by - py * ww + (rnd() - 0.5) * 0.18
      });
    }
    outline.push({ x: cx, y: cy });
    const vein = hline(cx, cy, cx + dx * len * 0.92, cy + dy * len * 0.92, 9, 0.1, rnd);
    return { outline, vein };
  }

  function cloverLeaf(cx, cy, ang, s, rnd) {
    const dx = Math.cos(ang), dy = Math.sin(ang);
    const px = -dy, py = dx;
    const n = 10;
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const w = Math.sin(t * Math.PI) * s * 0.55;
      pts.push({
        x: cx + dx * s * t + px * w + (rnd() - 0.5) * 0.06,
        y: cy + dy * s * t + py * w + (rnd() - 0.5) * 0.06
      });
    }
    for (let i = n; i >= 0; i--) {
      const t = i / n;
      const w = Math.sin(t * Math.PI) * s * 0.55;
      pts.push({
        x: cx + dx * s * t - px * w + (rnd() - 0.5) * 0.06,
        y: cy + dy * s * t - py * w + (rnd() - 0.5) * 0.06
      });
    }
    return pts;
  }

  function buildArtwork() {
    const rnd = makeRand(20260814);
    const A = [];

    function stroke(points, opts) {
      if (!points || points.length < 2) return;
      const m = measure(points);
      A.push(Object.assign({
        type: "stroke",
        points,
        color: "#1c130c",
        width: 0.42,
        alpha: 1,
        speed: 34,
        length: m.L,
        cum: m.cum
      }, opts || {}));
    }
    function move(x, y, duration, lift) {
      A.push({ type: "move", x, y, duration: duration == null ? 0.26 : duration, lift: lift == null ? 3.2 : lift });
    }
    function pause(duration) {
      A.push({ type: "pause", duration });
    }
    function dot(x, y, r, color, alpha, duration) {
      A.push({ type: "dot", x, y, r, color, alpha: alpha == null ? 1 : alpha, duration: duration == null ? 0.05 : duration });
    }

    const INK = "#1a120b";
    const INK2 = "#2a1b12";
    const INKSOFT = "#3a2818";

    pause(0.85);

    const tL = cbez(47.55, 59.6, 46.4, 67.2, 45.1, 76.4, 43.2, 86.7, 30, 0.26, rnd);
    const tR = cbez(52.5, 59.6, 54.0, 67.0, 55.5, 76.2, 56.9, 86.6, 30, 0.26, rnd);

    move(tL[0].x, tL[0].y, 0.7, 5);
    stroke(tL, { color: INK, width: 0.58, speed: 26 });
    move(tR[0].x, tR[0].y, 0.22, 2.2);
    stroke(tR, { color: INK, width: 0.58, speed: 26 });
    stroke(qbez(43.2, 86.7, 50.0, 87.5, 56.9, 86.6, 10, 0.18, rnd), { color: INK, width: 0.4, speed: 30 });

    move(48.4, 62.4, 0.18, 1.6);
    stroke(cbez(48.4, 62.4, 47.6, 70, 46.8, 78, 46.2, 84.6, 16, 0.2, rnd), { color: INK2, width: 0.28, speed: 38, alpha: 0.75 });
    move(50.6, 63.0, 0.12, 1.2);
    stroke(cbez(50.6, 63.0, 51.4, 71, 52.4, 78.5, 53.2, 84.8, 16, 0.2, rnd), { color: INK2, width: 0.26, speed: 38, alpha: 0.7 });
    move(49.2, 66.5, 0.1, 1);
    stroke(cbez(49.2, 66.5, 48.6, 73, 48.2, 79, 47.8, 84.2, 12, 0.16, rnd), { color: INKSOFT, width: 0.2, speed: 42, alpha: 0.55 });

    move(47.8, 71.2, 0.14, 1.4);
    stroke(qbez(47.8, 71.2, 49.6, 72.6, 51.6, 71.0, 9, 0.14, rnd), { color: INK2, width: 0.28, speed: 32 });
    stroke(qbez(47.9, 71.8, 49.5, 73.4, 51.4, 71.6, 7, 0.1, rnd), { color: INK2, width: 0.18, speed: 36, alpha: 0.7 });

    move(43.4, 86.4, 0.2, 1.8);
    stroke(cbez(43.4, 86.4, 39.2, 87.6, 34.6, 88.8, 30.4, 87.6, 16, 0.22, rnd), { color: INK, width: 0.42, speed: 30 });
    stroke(cbez(42.6, 86.5, 39.8, 86.6, 36.8, 87.2, 33.8, 86.4, 10, 0.16, rnd), { color: INK2, width: 0.22, speed: 36, alpha: 0.7 });
    move(50.2, 87.0, 0.12, 1);
    stroke(cbez(50.2, 87.0, 49.4, 88.8, 48.2, 90.4, 47.2, 91.2, 10, 0.16, rnd), { color: INK, width: 0.36, speed: 32 });
    move(56.6, 86.4, 0.14, 1.4);
    stroke(cbez(56.6, 86.4, 60.8, 87.8, 65.4, 88.6, 70.2, 87.2, 16, 0.22, rnd), { color: INK, width: 0.42, speed: 30 });
    stroke(cbez(55.8, 86.5, 59.4, 86.8, 63.0, 87.2, 66.6, 86.2, 10, 0.16, rnd), { color: INK2, width: 0.22, speed: 36, alpha: 0.7 });

    move(22, 87.4, 0.28, 3);
    stroke(cbez(22.0, 87.4, 36.0, 85.6, 50.0, 88.2, 76.5, 86.8, 28, 0.28, rnd), { color: INK, width: 0.38, speed: 32 });
    stroke(cbez(24.0, 87.8, 38.0, 86.4, 54.0, 88.8, 74.5, 87.4, 16, 0.2, rnd), { color: INKSOFT, width: 0.2, speed: 40, alpha: 0.45 });

    const greens = ["#2f5a28", "#3d7340", "#1f3f1c", "#4a8a3a", "#2a4e24", "#5b9444", "#355c2e"];
    const browns = ["#6a3e24", "#8a5530", "#5a321c", "#a06a3c", "#7a4a28", "#4a2816", "#b07a48"];

    const trunkPoly = tL.concat(tR.slice().reverse());
    const xs = trunkPoly.map(p => p.x), ys = trunkPoly.map(p => p.y);
    const minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
    const minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);

    function inTrunk(x, y) {
      let inside = false;
      for (let i = 0, j = trunkPoly.length - 1; i < trunkPoly.length; j = i++) {
        const xi = trunkPoly[i].x, yi = trunkPoly[i].y;
        const xj = trunkPoly[j].x, yj = trunkPoly[j].y;
        const hit = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-6) + xi);
        if (hit) inside = !inside;
      }
      return inside;
    }

    move(48, 64, 0.15, 1.5);
    let firstBark = true;
    let attempts = 0;
    let made = 0;
    while (made < 46 && attempts < 900) {
      attempts++;
      const x = minX + rnd() * (maxX - minX);
      const y = minY + rnd() * (maxY - minY);
      if (!inTrunk(x, y)) continue;
      const ang = -0.25 + rnd() * 0.7;
      const len = 1.1 + rnd() * 2.4;
      const x2 = x + Math.cos(ang) * len;
      const y2 = y + Math.sin(ang) * len;
      const col = browns[(rnd() * browns.length) | 0];
      if (firstBark) { firstBark = false; } 
      stroke(hline(x, y, x2, y2, 5, 0.18, rnd), {
        color: col,
        width: 0.55 + rnd() * 0.55,
        alpha: 0.28 + rnd() * 0.28,
        speed: 88
      });
      made++;
    }

    move(46.6, 61.5, 0.22, 2.4);
    stroke(cbez(46.6, 61.5, 43.5, 66.5, 41.8, 73.2, 43.6, 79.5, 18, 0.22, rnd), { color: INK, width: 0.32, speed: 30 });
    const vineLeaves = [
      { x: 44.6, y: 65.2, a: 200, l: 2.4 },
      { x: 42.8, y: 68.8, a: 188, l: 2.1 },
      { x: 42.2, y: 72.6, a: 210, l: 2.6 },
      { x: 42.6, y: 76.4, a: 175, l: 2.0 }
    ];
    vineLeaves.forEach(v => {
      const lf = simpleLeaf(v.x, v.y, v.a, v.l, 0.7, rnd);
      move(lf.outline[0].x, lf.outline[0].y, 0.1, 0.8);
      stroke(lf.outline, { color: INK, width: 0.22, speed: 48 });
    });

    move(40.5, 58.4, 0.25, 2.6);
    stroke(cbez(40.5, 58.4, 34.8, 60.8, 29.6, 64.5, 26.8, 69.2, 18, 0.22, rnd), { color: INK, width: 0.36, speed: 30 });
    stroke(cbez(38.8, 59.2, 35.4, 59.0, 32.6, 60.4, 31.2, 62.6, 10, 0.14, rnd), { color: INK2, width: 0.22, speed: 40, alpha: 0.75 });
    move(58.8, 58.0, 0.2, 2.2);
    stroke(cbez(58.8, 58.0, 64.2, 59.6, 69.4, 63.2, 72.4, 67.8, 18, 0.22, rnd), { color: INK, width: 0.36, speed: 30 });
    stroke(cbez(61.2, 58.8, 65.0, 58.6, 68.2, 60.2, 70.0, 62.8, 10, 0.14, rnd), { color: INK2, width: 0.22, speed: 40, alpha: 0.75 });

    const leafPlan = [
      { x: 50.0, y: 35.6, a: -92, l: 6.8, oak: true },
      { x: 42.6, y: 37.2, a: -128, l: 6.2, oak: true },
      { x: 57.6, y: 37.0, a: -52, l: 6.4, oak: true },
      { x: 36.8, y: 42.2, a: -168, l: 5.8, oak: false },
      { x: 63.4, y: 41.6, a: -12, l: 5.9, oak: false },
      { x: 35.6, y: 49.6, a: 178, l: 5.4, oak: true },
      { x: 64.6, y: 48.8, a: 8, l: 5.6, oak: true },
      { x: 39.2, y: 56.4, a: 150, l: 5.2, oak: false },
      { x: 61.0, y: 56.0, a: 32, l: 5.0, oak: false },
      { x: 46.2, y: 34.8, a: -108, l: 5.0, oak: false },
      { x: 54.2, y: 34.6, a: -74, l: 5.1, oak: false },
      { x: 33.8, y: 45.8, a: -150, l: 4.6, oak: false },
      { x: 66.4, y: 45.4, a: -20, l: 4.8, oak: false },
      { x: 44.0, y: 58.8, a: 125, l: 3.8, oak: false },
      { x: 56.4, y: 58.4, a: 55, l: 3.6, oak: false }
    ];

    leafPlan.forEach((lp, idx) => {
      const leaf = lp.oak
        ? oakLeaf(lp.x, lp.y, lp.a, lp.l, rnd)
        : simpleLeaf(lp.x, lp.y, lp.a, lp.l, lp.l * 0.28, rnd);
      move(leaf.outline[0].x, leaf.outline[0].y, idx === 0 ? 0.28 : 0.11, 1.6);
      stroke(leaf.outline, { color: INK, width: 0.3, speed: 42 });
      stroke(leaf.vein, { color: INK2, width: 0.16, speed: 55, alpha: 0.7 });
    });

    function foliageBurst(cx, cy, n) {
      for (let i = 0; i < n; i++) {
        const a = rnd() * Math.PI * 2;
        const l = 1.1 + rnd() * 2.2;
        const x2 = cx + Math.cos(a) * l;
        const y2 = cy + Math.sin(a) * l * 0.9;
        stroke(qbez(cx, cy, cx + Math.cos(a) * l * 0.5 + (rnd() - 0.5), cy + Math.sin(a) * l * 0.4, x2, y2, 6, 0.16, rnd), {
          color: INKSOFT,
          width: 0.2,
          speed: 70,
          alpha: 0.55
        });
      }
    }
    const bursts = [
      [41.5, 40.5], [58.8, 40.0], [37.8, 51.5], [62.4, 51.0],
      [48.2, 36.4], [52.6, 36.2], [45.6, 57.6], [54.8, 57.2]
    ];
    bursts.forEach((b, i) => {
      if (i === 0) move(b[0], b[1], 0.16, 1.4);
      foliageBurst(b[0], b[1], 4);
    });

    move(50, 40, 0.2, 2);

  function drawPortion(a, t0, t1) {
    if (t1 <= t0) return;
    const d0 = t0 * a.length;
    const d1 = t1 * a.length;
    const p0 = atLen(a.points, a.cum, d0);
    const pts = [{ x: p0.x, y: p0.y }];
    for (let i = 0; i < a.points.length; i++) {
      if (a.cum[i] > d0 && a.cum[i] < d1) pts.push(a.points[i]);
    }
    const p1 = atLen(a.points, a.cum, d1);
    pts.push({ x: p1.x, y: p1.y });

    inkCtx.save();
    inkCtx.globalAlpha = a.alpha;
    inkCtx.strokeStyle = a.color;
    inkCtx.lineWidth = Math.max(1, SW(a.width));
    inkCtx.lineCap = "round";
    inkCtx.lineJoin = "round";
    inkCtx.beginPath();
    inkCtx.moveTo(X(pts[0].x), Y(pts[0].y));
    for (let i = 1; i < pts.length; i++) inkCtx.lineTo(X(pts[i].x), Y(pts[i].y));
    inkCtx.stroke();
    inkCtx.restore();
  }

  function layout() {
    const nw = img.naturalWidth || 700;
    const nh = img.naturalHeight || 980;
    const maxW = window.innerWidth * 0.98;
    const maxH = window.innerHeight * 0.98;
    const s = Math.min(maxW / nw, maxH / nh);
    W = nw * s;
    H = nh * s;
    frame.style.width = W + "px";
    frame.style.height = H + "px";
    img.style.width = W + "px";
    img.style.height = H + "px";
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    [ink, cur].forEach(c => {
      c.style.width = W + "px";
      c.style.height = H + "px";
      c.width = Math.round(W * dpr);
      c.height = Math.round(H * dpr);
    });
    inkCtx = ink.getContext("2d");
    curCtx = cur.getContext("2d");
    inkCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    curCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function startShow() {
    actI = 0;
    phase = 0;
    lastT = 0;
    finished = false;
    fading = false;
    fade = 1;
    showPencil = false;
    pencil.x = 18;
    pencil.y = 10;
    pencil.angle = 0.8;
    ink.style.opacity = "1";
    if (inkCtx) inkCtx.clearRect(0, 0, W, H);
  }

  function update(dt) {
    if (finished) {
      if (!fading && performance.now() - finishAt > 4800) fading = true;
      if (fading) {
        fade -= dt / 1.25;
        ink.style.opacity = String(Math.max(0, fade));
        showPencil = false;
        if (fade <= 0) startShow();
      }
      return;
    }
    if (actI >= actions.length) {
      finished = true;
      finishAt = performance.now();
      return;
    }
    const a = actions[actI];
    if (a.type === "pause") {
      showPencil = actI > 0;
      phase += dt / a.duration;
      if (phase >= 1) { actI++; phase = 0; lastT = 0; }
      return;
    }
    if (a.type === "move") {
      if (phase === 0) {
        a._x0 = pencil.x;
        a._y0 = pencil.y;
      }
      showPencil = true;
      phase += dt / a.duration;
      const t = Math.min(1, phase);
      const e = t * t * (3 - 2 * t);
      pencil.x = a._x0 + (a.x - a._x0) * e;
      pencil.y = a._y0 + (a.y - a._y0) * e - Math.sin(t * Math.PI) * a.lift;
      pencil.angle = Math.atan2(a.y - a._y0, a.x - a._x0) || pencil.angle;
      if (t >= 1) {
        pencil.x = a.x;
        pencil.y = a.y;
        actI++;
        phase = 0;
        lastT = 0;
      }
      return;
    }
    if (a.type === "dot") {
      showPencil = true;
      pencil.x = a.x;
      pencil.y = a.y;
      phase += dt / a.duration;
      if (phase >= 1) {
        inkCtx.save();
        inkCtx.globalAlpha = a.alpha;
        inkCtx.fillStyle = a.color;
        inkCtx.beginPath();
        inkCtx.arc(X(a.x), Y(a.y), Math.max(0.8, SW(a.r)), 0, Math.PI * 2);
        inkCtx.fill();
        inkCtx.restore();
        actI++;
        phase = 0;
        lastT = 0;
      }
      return;
    }
    if (a.type === "stroke") {
      showPencil = true;
      const speed = a.speed;
      const add = (speed * dt) / a.length;
      const t0 = phase;
      phase = Math.min(1, phase + add);
      drawPortion(a, t0, phase);
      const pos = atLen(a.points, a.cum, phase * a.length);
      pencil.x = pos.x;
      pencil.y = pos.y;
      pencil.angle = pos.angle;
      if (phase >= 1) {
        actI++;
        phase = 0;
        lastT = 0;
      }
    }
  }

  function loop(now) {
    if (!lastNow) lastNow = now;
    const dt = Math.min(0.05, (now - lastNow) / 1000);
    lastNow = now;
    update(dt);
    if (curCtx) {
      curCtx.clearRect(0, 0, W, H);
      if (showPencil && !fading) drawPencil(curCtx, pencil.x, pencil.y, pencil.angle);
    }
    requestAnimationFrame(loop);
  }

  function boot() {
    if (started) return;
    started = true;
    layout();
    actions = buildArtwork();
    startShow();
    lastNow = 0;
    requestAnimationFrame(loop);
  }

  let resizeTimer;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (!started) return;
      layout();
      startShow();
    }, 120);
  });

  if (img.complete && img.naturalWidth) {
    boot();
  } else {
    img.addEventListener("load", boot, { once: true });
    img.addEventListener("error", function () {
      img.src = makeFallback();
    }, { once: true });
    setTimeout(function () {
      if (!started) {
        if (!img.naturalWidth) img.src = makeFallback();
        else boot();
      }
    }, 2800);
  }
})();
</script>
</body>
</html>
