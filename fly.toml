# fly.toml — deploy with:  fly deploy
#
# First time only:
#   fly launch --no-deploy --copy-config --name pencil-draw
#   fly secrets set ANTHROPIC_API_KEY=... XAI_API_KEY=... GEMINI_API_KEY=...
#   fly secrets set PENCIL_PASSWORD=something        # optional but recommended
#
# Without those secrets the deployed app still works — it just shows the
# Built-in designer only, and costs nothing in API credit.

app = "pencil-draw"
primary_region = "sea"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  # Designs per hour per IP address, so a public URL can't drain the account.
  PENCIL_RATE_LIMIT = "20"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Scale to zero when idle: this is a toy, it shouldn't bill for sitting still.
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    timeout = "3s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1
